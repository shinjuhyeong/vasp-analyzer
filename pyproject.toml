[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vasp-analyzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ase>=3.29",
  "numpy>=2.2",
  "pydantic>=2.13,<3",
  "pymatgen>=2026.5.4",
  "typer>=0.16",
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "vaspparser==0.0.7",
]

[project.optional-dependencies]
dev = ["build>=1.3", "httpx>=0.28", "pytest>=8.4", "pytest-cov>=6.2", "ruff>=0.12"]

[project.scripts]
analyzer = "vasp_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vasp_analyzer"]
artifacts = ["/src/vasp_analyzer/normalizers/definitions/*.json"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
artifacts = ["/vscode/dist/webview"]
include = [
  "/src",
  "/tests",
  "/hatch_build.py",
  "/vscode/dist/webview",
  "/README.md",
  "/pyproject.toml",
  "/src/vasp_analyzer/normalizers/definitions/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["corpus: requires VASP_ANALYZER_CORPUS_DIR and reads local OUTCAR files"]

[tool.ruff]
target-version = "py311"
line-length = 100
