name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -m "not corpus" --cov=vasp_analyzer

  webview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vscode/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  release-artifacts:
    runs-on: ubuntu-latest
    needs: [python, webview]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vscode/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
        working-directory: vscode
      - run: pnpm test && pnpm typecheck && pnpm build
        working-directory: vscode
      - run: pnpm exec vsce package --no-dependencies
        working-directory: vscode
      - run: node scripts/verify-vsix-entrypoint.mjs vasp-analyzer-0.1.0.vsix
        working-directory: vscode
      - run: python -m pip install build
      - run: python -m build
      - name: Exercise schema 2 packaged offline artifacts
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python scripts/verify_release_artifacts.py \
            --wheel dist/*.whl \
            --sdist dist/*.tar.gz \
            --vsix vscode/*.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vasp-analyzer-release-artifacts
          path: |
            dist/*
            vscode/*.vsix
