name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -m "not corpus" --cov=vasp_analyzer

  webview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vscode/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Reject application runtime network URLs
        shell: bash
        run: '! grep -R -E "https?://" src --include="*.ts" --include="*.tsx" --exclude="*.test.*"'

  release-artifacts:
    runs-on: ubuntu-latest
    needs: [python, webview]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vscode/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
        working-directory: vscode
      - run: pnpm test && pnpm typecheck && pnpm build
        working-directory: vscode
      - run: pnpm exec vsce package --no-dependencies
        working-directory: vscode
      - run: python -m pip install build
      - run: python -m build
      - name: Inspect packaged offline assets
        shell: python
        run: |
          import glob, tarfile, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]
          vsix = glob.glob("vscode/*.vsix")[0]
          with zipfile.ZipFile(wheel) as archive:
              assert "vasp_analyzer/web_assets/index.js" in archive.namelist()
              assert "vasp_analyzer/web_assets/index.css" in archive.namelist()
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              assert any(name.endswith("/vscode/dist/webview/index.js") for name in names)
          with zipfile.ZipFile(vsix) as archive:
              assert "extension/dist/webview/index.js" in archive.namelist()
      - uses: actions/upload-artifact@v4
        with:
          name: vasp-analyzer-release-artifacts
          path: |
            dist/*
            vscode/*.vsix
